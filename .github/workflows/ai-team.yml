# Runs the AI team on GitHub.
# Triggers:
#   - an issue labelled "ai-team" (the "AI team task" issue form adds it automatically)
#   - any issue or PR comment that mentions @claude, e.g. "@claude as designer: mock up the pricing page"
# Setup: add an ANTHROPIC_API_KEY repository secret (Settings → Secrets and variables → Actions)
#        and install the Claude GitHub App: https://github.com/apps/claude
name: AI Team

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  work:
    if: |
      (github.event_name == 'issues' && (github.event.label.name == 'ai-team' || contains(github.event.issue.body, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Using a Claude Pro/Max subscription instead? Run `claude setup-token` locally,
          # save the result as the CLAUDE_CODE_OAUTH_TOKEN secret, and use this line instead:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ai-team
          claude_args: --max-turns 60
