# Every Monday the Chief of Staff reviews the week and opens a stand-up issue for the Founder.
# You can also run it any time from the Actions tab ("Run workflow").
name: Weekly Stand-up

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:

jobs:
  standup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Chief of Staff of this repository's AI team (see CLAUDE.md).
            Prepare the weekly stand-up for the Founder, following .claude/commands/standup.md,
            but instead of committing a file, publish it as a GitHub issue:
              1. Run `date +%F` to get today's date.
              2. Write the report to /tmp/standup.md.
              3. Run: gh issue create --title "Stand-up <date>" --body-file /tmp/standup.md
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh issue create:*),Bash(date:*)"
