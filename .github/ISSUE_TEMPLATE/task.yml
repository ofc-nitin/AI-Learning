name: AI team task
description: Give a task to a member of the AI team. They will start working on it automatically.
title: "[Task] "
labels: ["ai-team"]
body:
  - type: dropdown
    id: assignee
    attributes:
      label: Assign to
      description: Who should own this? Choose "Chief of Staff" for work that needs several roles.
      options:
        - Chief of Staff (plan & coordinate the whole team)
        - Product Manager
        - Researcher
        - Designer
        - Programmer
        - QA Engineer
        - Analyst
        - Ops
        - Marketing
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What do you want done, and why does it matter?
      placeholder: Research the top 5 competitors for our product and recommend how we should position against them.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context & constraints
      description: Links, data, deadlines, budget, things to avoid.
  - type: textarea
    id: done
    attributes:
      label: What does "done" look like?
      description: The deliverable you expect, e.g. "a markdown report with a comparison table", "a working login page with tests".
